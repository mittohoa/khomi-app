<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- Replaced by the --base-href passed to `flutter build web`. On GitHub
       Pages the app is served from a sub-path, so this must not stay "/". -->
  <base href="/khomi-app/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Đọc lại kho Khomi của bạn trên máy tính: đăng nhập, tìm kiếm, mở lại thứ đã lưu.">
  <meta name="theme-color" content="#6D5DF6">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Khomi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Khomi — kho của bạn</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while the engine downloads. Without it the page is a white
       rectangle for a couple of seconds, which reads as a broken link rather
       than as an app starting. Matches the app's own splash: the K mark on the
       brand ground, with the caret in gold. */
    html, body { height: 100%; margin: 0; background: #F7F6FC; }
    @media (prefers-color-scheme: dark) { html, body { background: #1E1B3A; } }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #6B6790;
    }
    #boot svg { width: 64px; height: 64px; }
    #boot .stroke { stroke: #6D5DF6; }
    @media (prefers-color-scheme: dark) { #boot .stroke { stroke: #A79BFF; } }
    #boot.done { display: none; }
  </style>
</head>
<body>
  <div id="boot">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g class="stroke" fill="none" stroke-width="9.4" stroke-linecap="round">
        <path d="M27.8 24.9 V76.7"/>
        <path d="M33.7 50 L59.2 28.9"/>
        <path d="M33.7 50 L59.2 72.7"/>
      </g>
      <rect x="67.2" y="32.2" width="6.4" height="37.1" rx="3.2" fill="#FBBF24"/>
    </svg>
    <span>Đang mở kho…</span>
  </div>
  <script>
    // The engine paints into the body; hide the placeholder once it has.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.classList.add('done');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
